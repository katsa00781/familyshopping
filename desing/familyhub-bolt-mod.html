<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FamilyHub – Bolt mód</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #FB7185;
    --canvas: #13201F;
    --bar: #0E1817;
    --hairline: #2A3B39;
    --text: #F1F5F4;
    --dim: #6E807D;
  }

  html, body {
    height: 100%;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: #E7E4DD;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 0;
  }

  /* ===== iPhone frame ===== */
  .device {
    position: relative;
    width: 390px;
    height: 844px;
    background: var(--canvas);
    border-radius: 54px;
    box-shadow:
      0 0 0 12px #1b1b1d,
      0 0 0 14px #2c2c2e,
      0 40px 80px rgba(0,0,0,0.4);
    overflow: hidden;
  }

  .island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 35px;
    background: #000;
    border-radius: 20px;
    z-index: 40;
  }

  .statusbar {
    position: relative;
    z-index: 30;
    height: 59px;
    padding: 0 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; }

  /* ===== Screen ===== */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* ===== Sticky bar ===== */
  .topbar {
    background: var(--bar);
    border-bottom: 1px solid var(--hairline);
    padding: 10px 22px 18px;
    z-index: 12;
  }
  .barrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .listname {
    min-width: 0;
  }
  .listname .kicker {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .listname .name {
    margin-top: 3px;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.6px;
    color: var(--text);
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .exit {
    flex-shrink: 0;
    height: 52px;
    padding: 0 22px;
    border-radius: 16px;
    background: var(--accent);
    color: #2A0E12;
    border: none;
    font-family: inherit;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(251,113,133,0.32);
  }
  .exit:active { transform: translateY(1px); }

  .counter {
    margin-top: 16px;
    display: flex;
    align-items: baseline;
    gap: 9px;
  }
  .counter .big {
    font-size: 21px;
    font-weight: 900;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.4px;
  }
  .counter .lab {
    font-size: 16px;
    font-weight: 700;
    color: var(--dim);
  }
  .track {
    margin-top: 10px;
    height: 8px;
    border-radius: 99px;
    background: #21302E;
    overflow: hidden;
  }
  .track .fill {
    height: 100%;
    border-radius: 99px;
    background: var(--accent);
  }

  /* ===== Scroll list ===== */
  .scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 40px;
    scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { display: none; }

  .row {
    min-height: 96px;
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
  }
  .row:active { background: rgba(255,255,255,0.025); }

  .box {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 3px solid #3C4F4C;
    background: transparent;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--canvas);
  }
  .box svg { opacity: 0; }

  .label { flex: 1; min-width: 0; }
  .label .item {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    line-height: 1.15;
  }
  .label .qty {
    margin-top: 3px;
    font-size: 16px;
    font-weight: 700;
    color: var(--dim);
  }

  /* checked — heavily dimmed, in place */
  .row.done { opacity: 0.34; }
  .row.done .box {
    background: var(--accent);
    border-color: var(--accent);
  }
  .row.done .box svg { opacity: 1; }
  .row.done .label .item {
    text-decoration: line-through;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--dim);
  }
</style>
</head>
<body>
  <div class="device">
    <div class="island"></div>

    <div class="statusbar">
      <div class="time">9:41</div>
      <div class="right">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 11.5l2.4-3a3.1 3.1 0 00-4.8 0l2.4 3zM3.4 5.2a8 8 0 0110.2 0l1.5-1.9a10.4 10.4 0 00-13.2 0l1.5 1.9zm2 2.5a4.8 4.8 0 016.2 0l1.5-1.9a7.2 7.2 0 00-9.2 0l1.5 1.9z"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><path d="M24 4v5a2 2 0 000-5z" fill="currentColor" opacity="0.4"/></svg>
      </div>
    </div>

    <div class="screen">

      <!-- ===== Sticky bar ===== -->
      <div class="topbar">
        <div class="barrow">
          <div class="listname">
            <div class="kicker">Bolt mód</div>
            <div class="name">Heti nagybevásárlás</div>
          </div>
          <button class="exit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            Kész
          </button>
        </div>
        <div class="counter">
          <span class="big">7 / 18</span>
          <span class="lab">tétel kész</span>
        </div>
        <div class="track"><div class="fill" style="width:39%"></div></div>
      </div>

      <!-- ===== List ===== -->
      <div class="scroll">

        <div class="row done">
          <div class="box"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="label">
            <div class="item">Paradicsom</div>
            <div class="qty">1 kg</div>
          </div>
        </div>

        <div class="row">
          <div class="box"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="label">
            <div class="item">Kígyóuborka</div>
            <div class="qty">3 db</div>
          </div>
        </div>

        <div class="row done">
          <div class="box"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="label">
            <div class="item">Sárgarépa</div>
            <div class="qty">1 csomag</div>
          </div>
        </div>

        <div class="row">
          <div class="box"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="label">
            <div class="item">Tej 2,8%</div>
            <div class="qty">6 l</div>
          </div>
        </div>

        <div class="row done">
          <div class="box"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="label">
            <div class="item">Görög joghurt</div>
            <div class="qty">4 db</div>
          </div>
        </div>

        <div class="row">
          <div class="box"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="label">
            <div class="item">Trappista sajt</div>
            <div class="qty">50 dkg</div>
          </div>
        </div>

        <div class="row">
          <div class="box"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="label">
            <div class="item">Csirkemell filé</div>
            <div class="qty">1,5 kg</div>
          </div>
        </div>

        <div class="row">
          <div class="box"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="label">
            <div class="item">Félbarna kenyér</div>
            <div class="qty">2 db</div>
          </div>
        </div>

      </div>

    </div>
  </div>
</body>
</html>
