<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FamilyHub – Esemény szerkesztő</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #14B8A6;
    --primary-fg: #FFFFFF;
    --accent: #FB7185;
    --success: #22C55E;
    --warning: #F59E0B;
    --destructive: #EF4444;
    --background: #F8F7F4;
    --card: #FFFFFF;
    --foreground: #1C2B2A;
    --muted: #8A8F8E;
    --border: #E9E7E1;
    --field: #F4F2ED;
    /* tagszínek */
    --m-teal: #14B8A6;
    --m-coral: #FB7185;
    --m-purple: #A78BFA;
    --m-yellow: #F59E0B;
    --m-blue: #38BDF8;
    --m-green: #34D399;
    /* aktív esemény szín (a kiválasztott tag adja) */
    --event: #A78BFA;
  }

  html, body {
    height: 100%;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: #E7E4DD;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 0;
  }

  /* ===== iPhone frame ===== */
  .device {
    position: relative;
    width: 390px;
    height: 844px;
    background: var(--background);
    border-radius: 54px;
    box-shadow:
      0 0 0 12px #1b1b1d,
      0 0 0 14px #2c2c2e,
      0 40px 80px rgba(0,0,0,0.32);
    overflow: hidden;
  }

  .island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 35px;
    background: #0a0a0b;
    border-radius: 20px;
    z-index: 60;
  }

  /* ===== Dimmed background calendar ===== */
  .backdrop {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .backdrop .dim {
    position: absolute;
    inset: 0;
    background: rgba(20,30,29,0.46);
    z-index: 10;
  }
  /* faux calendar behind */
  .bg-statusbar {
    height: 59px;
    padding: 0 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 700;
    color: var(--foreground);
  }
  .bg-statusbar .right { display: flex; align-items: center; gap: 6px; }
  .bg-header {
    padding: 6px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .bg-title { font-size: 24px; font-weight: 800; color: var(--foreground); letter-spacing: -0.5px; }
  .bg-ma {
    background: rgba(20,184,166,0.12);
    color: var(--primary);
    border-radius: 14px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 800;
  }
  .bg-cal {
    margin: 0 16px;
    background: var(--card);
    border-radius: 24px;
    padding: 16px 14px 18px;
  }
  .bg-weekdays, .bg-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .bg-weekdays span {
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    color: var(--muted);
    padding-bottom: 8px;
  }
  .bg-grid { row-gap: 8px; }
  .bg-grid b {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--foreground);
    height: 30px;
    line-height: 30px;
  }
  .bg-grid b.t {
    background: var(--primary);
    color: #fff;
    width: 30px;
    border-radius: 50%;
    margin: 0 auto;
  }

  /* ===== Bottom sheet ===== */
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 85%;
    background: var(--background);
    border-radius: 28px 28px 0 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.22);
    z-index: 50;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .grab {
    padding: 10px 0 4px;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }
  .grab span {
    width: 38px;
    height: 5px;
    border-radius: 99px;
    background: #D7D3CA;
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 18px 10px;
    flex-shrink: 0;
  }
  .sheet-head .h-title {
    font-size: 19px;
    font-weight: 800;
    color: var(--foreground);
    letter-spacing: -0.3px;
  }
  .sheet-head .close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(28,43,42,0.06);
    color: var(--foreground);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* ===== Scrollable form ===== */
  .form {
    flex: 1;
    overflow-y: auto;
    padding: 4px 18px 16px;
  }
  .form::-webkit-scrollbar { display: none; }

  .field { margin-bottom: 18px; }
  .label {
    display: block;
    font-size: 13px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.1px;
    margin: 0 2px 7px;
    text-transform: uppercase;
  }
  .label .opt {
    text-transform: none;
    font-weight: 700;
    color: #B8BCBA;
  }

  .input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 15px 16px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: var(--foreground);
    letter-spacing: -0.2px;
  }
  .input::placeholder { color: #C2C6C4; font-weight: 600; }
  .input:focus {
    outline: none;
    border-color: var(--event);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--event) 14%, transparent);
  }
  textarea.input {
    resize: none;
    min-height: 88px;
    font-size: 15.5px;
    line-height: 1.45;
    font-weight: 600;
  }

  /* title input – nagy, széles összetett szavakhoz */
  .title-input {
    font-size: 22px;
    font-weight: 800;
    padding: 16px 18px;
    letter-spacing: -0.4px;
  }

  /* ===== Toggle row ===== */
  .row-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
  }
  .row-card .rl {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .row-card .ricon {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: rgba(20,184,166,0.12);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .row-card .rt {
    font-size: 16px;
    font-weight: 700;
    color: var(--foreground);
    letter-spacing: -0.2px;
  }
  .switch {
    width: 52px;
    height: 31px;
    border-radius: 99px;
    background: var(--primary);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .2s;
  }
  .switch.off { background: #D8D4CB; }
  .switch i {
    position: absolute;
    top: 2.5px;
    left: 24px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.18);
    transition: left .2s;
  }
  .switch.off i { left: 2.5px; }

  /* ===== Time picker rows ===== */
  .when-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .when-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    gap: 10px;
  }
  .when-row + .when-row { border-top: 1.5px solid var(--border); }
  .when-row .wl {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .when-row .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .when-row .wt {
    font-size: 16px;
    font-weight: 700;
    color: var(--foreground);
  }
  .when-row .pick {
    display: flex;
    gap: 8px;
  }
  .pill {
    background: var(--field);
    border-radius: 11px;
    padding: 8px 13px;
    font-size: 15px;
    font-weight: 800;
    color: var(--foreground);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.2px;
    white-space: nowrap;
  }
  .pill.time { color: var(--event); }

  /* ===== Member chips ===== */
  .members {
    display: flex;
    gap: 14px;
    padding: 4px 2px 2px;
    overflow-x: auto;
  }
  .members::-webkit-scrollbar { display: none; }
  .member {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    flex-shrink: 0;
    width: 58px;
  }
  .member .av-wrap {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2.5px solid transparent;
    transition: border-color .15s, transform .15s;
  }
  .member.sel .av-wrap {
    border-color: var(--mc);
    transform: scale(1.04);
  }
  .member .av {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
  }
  .member .mname {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: -0.1px;
  }
  .member.sel .mname { color: var(--foreground); font-weight: 800; }
  .member .check {
    position: absolute;
    bottom: 22px;
    right: 4px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--mc);
    border: 2px solid var(--background);
    display: none;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .member { position: relative; }
  .member.sel .check { display: flex; }

  /* ===== Footer ===== */
  .footer {
    flex-shrink: 0;
    padding: 12px 18px calc(18px + env(safe-area-inset-bottom));
    background: var(--background);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn-delete {
    border: none;
    background: transparent;
    color: var(--destructive);
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: -0.2px;
    padding: 9px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  .btn-save {
    border: none;
    background: var(--primary);
    color: var(--primary-fg);
    font-family: inherit;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.2px;
    padding: 18px;
    border-radius: 18px;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(20,184,166,0.36);
  }
</style>
</head>
<body>
  <div class="device">
    <div class="island"></div>

    <!-- ===== Dimmed background calendar ===== -->
    <div class="backdrop">
      <div class="bg-statusbar">
        <div>9:41</div>
        <div class="right">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><path d="M24 4v5a2 2 0 000-5z" fill="currentColor" opacity="0.4"/></svg>
        </div>
      </div>
      <div class="bg-header">
        <div class="bg-title">2026. június</div>
        <div class="bg-ma">Ma</div>
      </div>
      <div class="bg-cal">
        <div class="bg-weekdays"><span>H</span><span>K</span><span>Sze</span><span>Cs</span><span>P</span><span>Szo</span><span>V</span></div>
        <div class="bg-grid">
          <b>15</b><b>16</b><b>17</b><b>18</b><b class="t">19</b><b>20</b><b>21</b>
          <b>22</b><b>23</b><b>24</b><b>25</b><b>26</b><b>27</b><b>28</b>
        </div>
      </div>
      <div class="dim"></div>
    </div>

    <!-- ===== Bottom sheet (esemény szerkesztő) ===== -->
    <div class="sheet">
      <div class="grab"><span></span></div>

      <div class="sheet-head">
        <div class="h-title">Esemény szerkesztése</div>
        <button class="close" aria-label="Bezárás">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="form">

        <!-- Cím -->
        <div class="field">
          <label class="label">Cím</label>
          <input class="input title-input" type="text" value="Zongoraóra" />
        </div>

        <!-- Egész napos -->
        <div class="field">
          <div class="row-card">
            <div class="rl">
              <div class="ricon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              </div>
              <div class="rt">Egész napos</div>
            </div>
            <div class="switch off" role="switch"><i></i></div>
          </div>
        </div>

        <!-- Kezdet / vég -->
        <div class="field">
          <label class="label">Időpont</label>
          <div class="when-card">
            <div class="when-row">
              <div class="wl">
                <span class="dot" style="background:var(--event)"></span>
                <span class="wt">Kezdet</span>
              </div>
              <div class="pick">
                <span class="pill">2026. jún. 19.</span>
                <span class="pill time">15:00</span>
              </div>
            </div>
            <div class="when-row">
              <div class="wl">
                <span class="dot" style="background:#D8D4CB"></span>
                <span class="wt">Vége</span>
              </div>
              <div class="pick">
                <span class="pill">2026. jún. 19.</span>
                <span class="pill time">16:00</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Családtag -->
        <div class="field">
          <label class="label">Kihez tartozik</label>
          <div class="members">
            <div class="member" style="--mc:var(--m-teal)">
              <div class="av-wrap"><div class="av" style="background:var(--m-teal)">An</div></div>
              <div class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
              <div class="mname">Anna</div>
            </div>
            <div class="member" style="--mc:var(--m-coral)">
              <div class="av-wrap"><div class="av" style="background:var(--m-coral)">Be</div></div>
              <div class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
              <div class="mname">Bence</div>
            </div>
            <div class="member sel" style="--mc:var(--m-purple)">
              <div class="av-wrap"><div class="av" style="background:var(--m-purple)">Li</div></div>
              <div class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
              <div class="mname">Lili</div>
            </div>
            <div class="member" style="--mc:var(--m-yellow)">
              <div class="av-wrap"><div class="av" style="background:var(--m-yellow)">Ap</div></div>
              <div class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
              <div class="mname">Apa</div>
            </div>
            <div class="member" style="--mc:var(--m-blue)">
              <div class="av-wrap"><div class="av" style="background:var(--m-blue)">Na</div></div>
              <div class="check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
              <div class="mname">Nagyi</div>
            </div>
          </div>
        </div>

        <!-- Hely -->
        <div class="field">
          <label class="label">Hely <span class="opt">· opcionális</span></label>
          <input class="input" type="text" value="Zeneiskola" placeholder="Hol lesz?" />
        </div>

        <!-- Jegyzet -->
        <div class="field">
          <label class="label">Jegyzet <span class="opt">· opcionális</span></label>
          <textarea class="input" placeholder="Megjegyzés, emlékeztető…">Kottát és a piros mappát ne felejtsük otthon.</textarea>
        </div>

      </div>

      <!-- ===== Footer ===== -->
      <div class="footer">
        <button class="btn-delete">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
          Esemény törlése
        </button>
        <button class="btn-save">Mentés</button>
      </div>
    </div>
  </div>
</body>
</html>
